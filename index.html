<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจองโปรเจคเตอร์ออนไลน์</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- React & ReactDOM -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel for JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Google Fonts (Prompt) -->
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Prompt', sans-serif; }
  .animate-fade-in { animation: fadeIn 0.5s ease-out; }
  .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
  .animate-fade-in-right { animation: fadeInRight 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInRight { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  /* Loading Spinner */
  .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 text-gray-800 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// --- Inline SVG Icons ---
const Icons = {
  Monitor: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>,
  Clock: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
  Calendar: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
  User: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
  Users: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
  CheckCircle: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
  Search: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
  Menu: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
  X: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
  ShieldAlert: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
  LogOut: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
  Key: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
};

const SLOTS = ["08:30-10:00", "10:00-11:30", "11:30-13:00", "13:00-14:30", "14:30-16:00", "16:00-17:30", "17:30-19:00", "19:00-20:30", "20:30-22:00", "22:00-23:30"];
const MACHINES = [1, 2, 3, 4, 5];

// --- Google Apps Script API Wrapper ---
const ServerAPI = {
  invoke: (funcName, ...args) => new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [funcName](...args);
    } else {
      // Mock สำหรับเปิดพรีวิวใน Local โดยไม่มี Backend
      console.warn(`Mocking ServerAPI.${funcName}`);
      setTimeout(() => {
        if (funcName === 'verifyStudent') resolve(args[0] === '65010201001' ? {success:true, data:{name:'สมชาย เทส', studentId: args[0]}} : {success:false, message:'ไม่พบข้อมูล'});
        if (funcName === 'getBookings') resolve([]);
        if (funcName === 'saveBooking') resolve({success:true, bookingId:'BK-MOCK', machine:1, cancelCode:'1234'});
        if (funcName === 'cancelBooking') resolve({success:true});
        if (funcName === 'cancelBookingByCode') resolve(args[1] === '1234' ? {success:true} : {success:false, message:'รหัสยกเลิกไม่ถูกต้อง (mock ใช้ 1234)'});
        if (funcName === 'markAsUsed') resolve({success:true});
      }, 800);
    }
  })
};

function App() {
  const [currentView, setCurrentView] = useState('home');
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [bookings, setBookings] = useState([]);
  const [toast, setToast] = useState(null);
  const [isLoadingData, setIsLoadingData] = useState(true);

  useEffect(() => {
    // โหลดข้อมูลการจองเมื่อเปิดแอป
    ServerAPI.invoke('getBookings').then(res => {
      setBookings(res || []);
      setIsLoadingData(false);
    }).catch(() => setIsLoadingData(false));
  }, []);

  const showToast = (message, type = 'info') => {
    setToast({ message, type });
    setTimeout(() => setToast(null), 3500);
  };

  const navigate = (view) => {
    setCurrentView(view);
    setIsMobileMenuOpen(false);
    // Refresh bookings when switching views to ensure fresh data
    if (view === 'schedule' || view === 'admin' || view === 'mybooking') {
      ServerAPI.invoke('getBookings').then(res => setBookings(res || []));
    }
  };

  return (
    <div>
      {/* Navbar */}
      <nav className="bg-white/70 backdrop-blur-md sticky top-0 z-50 border-b border-white/20 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex justify-between h-16">
            <div className="flex items-center cursor-pointer" onClick={() => navigate('home')}>
              <div className="bg-blue-600 p-2 rounded-xl mr-3 shadow-lg shadow-blue-200">
                <Icons.Monitor className="h-5 w-5 text-white" />
              </div>
              <span className="font-bold text-xl bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-indigo-700">MSU ProjBook</span>
            </div>
            {/* Desktop Menu */}
            <div className="hidden md:flex items-center space-x-6">
              {['home', 'booking', 'schedule', 'mybooking'].map(v => (
                <button key={v} onClick={() => navigate(v)} className={`font-medium transition-colors ${currentView === v ? 'text-blue-600' : 'text-gray-500 hover:text-blue-600'}`}>
                  {v === 'home' ? 'หน้าแรก' : v === 'booking' ? 'จองโปรเจคเตอร์' : v === 'schedule' ? 'ตารางการใช้งาน' : 'การจองของฉัน'}
                </button>
              ))}
              <div className="h-6 w-px bg-gray-300"></div>
              <button onClick={() => navigate('admin')} className="flex items-center text-sm font-medium text-gray-500 hover:text-indigo-600">
                <Icons.ShieldAlert className="h-4 w-4 mr-1" /> Admin
              </button>
            </div>
            {/* Mobile Menu Button */}
            <div className="flex items-center md:hidden">
              <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gray-600 hover:text-gray-900 focus:outline-none">
                {isMobileMenuOpen ? <Icons.X className="h-6 w-6" /> : <Icons.Menu className="h-6 w-6" />}
              </button>
            </div>
          </div>
        </div>
        {/* Mobile Menu Panel */}
        {isMobileMenuOpen && (
          <div className="md:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full left-0">
            <div className="px-2 pt-2 pb-3 space-y-1 sm:px-3">
              <button onClick={() => navigate('home')} className="flex w-full items-center px-3 py-2 rounded-md font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50">หน้าแรก</button>
              <button onClick={() => navigate('booking')} className="flex w-full items-center px-3 py-2 rounded-md font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50">จองโปรเจคเตอร์</button>
              <button onClick={() => navigate('schedule')} className="flex w-full items-center px-3 py-2 rounded-md font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50">ตารางการใช้งาน</button>
              <button onClick={() => navigate('mybooking')} className="flex w-full items-center px-3 py-2 rounded-md font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50">การจองของฉัน</button>
              <button onClick={() => navigate('admin')} className="flex w-full items-center px-3 py-2 rounded-md font-medium text-gray-500 hover:text-indigo-600 hover:bg-indigo-50">ผู้ดูแลระบบ</button>
            </div>
          </div>
        )}
      </nav>

      {/* Main Content Area */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {currentView === 'home' && <HomeView navigate={navigate} />}
        {currentView === 'booking' && <BookingView navigate={navigate} bookings={bookings} setBookings={setBookings} showToast={showToast} />}
        {currentView === 'schedule' && <ScheduleView bookings={bookings} isLoading={isLoadingData} />}
        {currentView === 'mybooking' && <MyBookingView bookings={bookings} setBookings={setBookings} showToast={showToast} />}
        {currentView === 'admin' && <AdminView bookings={bookings} setBookings={setBookings} showToast={showToast} />}
      </main>

      {/* Toast */}
      {toast && (
        <div className="fixed bottom-4 right-4 z-50 animate-fade-in-up">
          <div className={`rounded-lg px-4 py-3 shadow-lg flex items-center ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-green-500' : 'bg-blue-600'} text-white`}>
            <Icons.CheckCircle className="h-5 w-5 mr-2" />
            {toast.message}
          </div>
        </div>
      )}
    </div>
  );
}

// --- Sub Components ---

function HomeView({ navigate }) {
  const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, mins: 0, secs: 0 });

  useEffect(() => {
    const currentYear = new Date().getFullYear();
    let targetDate = new Date(`${currentYear}-09-30T23:59:59`);
    if (new Date() > targetDate) targetDate = new Date(`${currentYear + 1}-09-30T23:59:59`);
    const timer = setInterval(() => {
      const distance = targetDate.getTime() - new Date().getTime();
      setTimeLeft({
        days: Math.floor(distance / (1000 * 60 * 60 * 24)),
        hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
        mins: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
        secs: Math.floor((distance % (1000 * 60)) / 1000)
      });
    }, 1000);
    return () => clearInterval(timer);
  }, []);

  return (
    <div className="space-y-8 animate-fade-in">
      <div className="relative bg-white/60 backdrop-blur-xl border border-white/40 shadow-xl rounded-3xl overflow-hidden">
        <div className="absolute top-0 right-0 -mt-20 -mr-20 w-80 h-80 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div className="relative px-6 py-16 sm:px-12 sm:py-24 text-center">
          <h1 className="text-4xl sm:text-5xl font-extrabold text-gray-900 tracking-tight mb-4">ระบบจองโปรเจคเตอร์ออนไลน์</h1>
          <p className="mt-4 max-w-2xl text-lg text-gray-600 mx-auto">สะดวก รวดเร็ว เช็คคิวได้ทันที ให้บริการ 5 เครื่อง ตั้งแต่เวลา 08:30 - 23:30 น.</p>
          <div className="mt-10 flex justify-center gap-4">
            <button onClick={() => navigate('booking')} className="px-8 py-4 text-lg font-medium rounded-2xl text-white bg-blue-600 hover:bg-blue-700 shadow-lg transform hover:scale-105 transition-all">เริ่มทำการจอง</button>
            <button onClick={() => navigate('schedule')} className="px-8 py-4 text-lg font-medium rounded-2xl text-blue-700 bg-white/50 hover:bg-white border-2 border-white shadow-sm transition-all">ดูตารางวันนี้</button>
          </div>
        </div>
      </div>
      <div className="bg-gradient-to-r from-red-500 to-orange-500 rounded-3xl shadow-lg text-white p-8">
        <div className="flex flex-col md:flex-row items-center justify-between">
          <div>
            <h3 className="text-2xl font-bold flex items-center mb-2"><Icons.Clock className="mr-2 h-6 w-6" /> นับถอยหลังปิดระบบ</h3>
            <p className="text-red-100">ระบบจะปิดให้จองในวันที่ 30 กันยายน นี้</p>
          </div>
          <div className="flex gap-4 mt-6 md:mt-0">
            {['days', 'hours', 'mins', 'secs'].map(unit => (
              <div key={unit} className="bg-black/20 backdrop-blur-sm rounded-xl p-4 text-center min-w-[80px]">
                <div className="text-3xl font-bold">{timeLeft[unit]}</div>
                <div className="text-xs text-red-100 uppercase mt-1">{unit === 'days' ? 'วัน' : unit === 'hours' ? 'ชม.' : unit === 'mins' ? 'นาที' : 'วิ'}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function BookingView({ navigate, bookings, setBookings, showToast }) {
  const [step, setStep] = useState(1);
  const [isProcessing, setIsProcessing] = useState(false);
  const [formData, setFormData] = useState({ studentId: '', studentName: '', groupName: '', repName: '', date: '', slot: '' });
  const [assignedDetails, setAssignedDetails] = useState(null);

  const handleIdCheck = async (e) => {
    e.preventDefault();
    setIsProcessing(true);
    const res = await ServerAPI.invoke('verifyStudent', formData.studentId);
    setIsProcessing(false);
    if (res.success) {
      setFormData({ ...formData, studentName: res.data.name, repName: res.data.name });
      setStep(2);
    } else {
      showToast(res.message, 'error');
    }
  };

  const checkAvailability = (date, slot) => {
    const booked = bookings.filter(b => b.date === date && b.slot === slot && b.status !== 'CANCELLED').map(b => Number(b.machine));
    return MACHINES.filter(m => !booked.includes(m));
  };

  const handleBookingConfirm = async () => {
    setIsProcessing(true);
    const res = await ServerAPI.invoke('saveBooking', formData);
    setIsProcessing(false);
    if (res.success) {
      setAssignedDetails({ id: res.bookingId, machine: res.machine, cancelCode: res.cancelCode });
      // อัปเดต state local โดยไม่ต้องรอ refresh แบบเต็มๆ
      setBookings([...bookings, { ...formData, id: res.bookingId, machine: res.machine, status: 'ACTIVE' }]);
      setStep(4);
      showToast('จองคิวสำเร็จ', 'success');
    } else {
      showToast(res.message, 'error');
    }
  };

  return (
    <div className="max-w-2xl mx-auto animate-fade-in">
      <div className="bg-white/80 backdrop-blur-xl border border-white shadow-2xl rounded-3xl p-6 sm:p-10">
        {/* Progress Bar (simplified) */}
        <div className="flex justify-between items-center mb-10 relative">
          <div className="absolute w-full h-1 bg-gray-200 -z-10 top-1/2 -translate-y-1/2"></div>
          <div className="absolute h-1 bg-blue-600 -z-10 top-1/2 -translate-y-1/2 transition-all" style={{ width: `${((step - 1) / 3) * 100}%` }}></div>
          {[1, 2, 3, 4].map(i => (
            <div key={i} className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${step >= i ? 'bg-blue-600 text-white' : 'bg-white border-2 border-gray-200 text-gray-400'}`}>{i}</div>
          ))}
        </div>

        {/* Step 1 */}
        {step === 1 && (
          <form onSubmit={handleIdCheck} className="space-y-6">
            <h2 className="text-2xl font-bold flex items-center"><Icons.User className="mr-2 text-blue-600 h-6 w-6"/> 1. ยืนยันตัวตน</h2>
            <div>
              <label className="block text-sm font-medium mb-2">รหัสนิสิต</label>
              <input type="text" required className="w-full rounded-xl border-gray-300 border shadow-sm p-4 focus:border-blue-500" placeholder="รหัส 11 หลัก" value={formData.studentId} onChange={e => setFormData({...formData, studentId: e.target.value})} />
            </div>
            <button type="submit" disabled={isProcessing} className="w-full py-4 bg-blue-600 text-white rounded-xl shadow-md font-medium disabled:bg-gray-400 flex justify-center items-center">
              {isProcessing ? <div className="loader border-t-white"></div> : 'ตรวจสอบข้อมูล'}
            </button>
          </form>
        )}

        {/* Step 2 */}
        {step === 2 && (
          <form onSubmit={e => { e.preventDefault(); setStep(3); }} className="space-y-6">
            <h2 className="text-2xl font-bold flex items-center"><Icons.Users className="mr-2 text-blue-600 h-6 w-6"/> 2. ข้อมูลกลุ่ม</h2>
            <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
              <p className="text-sm text-blue-800">พบข้อมูล: <strong>{formData.studentName}</strong></p>
            </div>
            <input type="text" required className="w-full rounded-xl border p-4 shadow-sm" placeholder="ชื่อกลุ่ม / โครงงาน" value={formData.groupName} onChange={e => setFormData({...formData, groupName: e.target.value})} />
            <div className="flex gap-4">
              <button type="button" onClick={() => setStep(1)} className="w-1/3 py-4 border rounded-xl">ย้อนกลับ</button>
              <button type="submit" className="w-2/3 py-4 bg-blue-600 text-white rounded-xl">ถัดไป</button>
            </div>
          </form>
        )}

        {/* Step 3 */}
        {step === 3 && (
          <div className="space-y-6">
            <h2 className="text-2xl font-bold flex items-center"><Icons.Calendar className="mr-2 text-blue-600 h-6 w-6"/> 3. เลือกเวลา</h2>
            <input type="date" min={new Date().toISOString().split('T')[0]} className="w-full rounded-xl border p-4 shadow-sm" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value, slot: ''})} />
            {formData.date && (
              <div className="grid grid-cols-2 gap-3">
                {SLOTS.map(slot => {
                  const avail = checkAvailability(formData.date, slot);
                  const isFull = avail.length === 0;
                  return (
                    <button key={slot} disabled={isFull} onClick={() => setFormData({...formData, slot})} className={`p-3 rounded-xl border text-sm flex flex-col items-center ${formData.slot === slot ? 'bg-blue-600 text-white border-blue-600' : isFull ? 'bg-gray-100 text-gray-400 opacity-60' : 'bg-white hover:bg-blue-50 border-blue-200'}`}>
                      <span className="font-semibold">{slot}</span>
                      <span className="text-xs">{isFull ? 'เต็มแล้ว' : `ว่าง ${avail.length} เครื่อง`}</span>
                    </button>
                  );
                })}
              </div>
            )}
            <div className="flex gap-4 pt-4">
              <button onClick={() => setStep(2)} className="w-1/3 py-4 border rounded-xl">ย้อนกลับ</button>
              <button onClick={handleBookingConfirm} disabled={!formData.date || !formData.slot || isProcessing} className="w-2/3 py-4 bg-green-600 text-white rounded-xl flex justify-center items-center disabled:bg-gray-400">
                {isProcessing ? <div className="loader border-t-white"></div> : 'ยืนยันการจอง'}
              </button>
            </div>
          </div>
        )}

        {/* Step 4 */}
        {step === 4 && assignedDetails && (
          <div className="text-center py-8">
            <Icons.CheckCircle className="h-20 w-20 text-green-500 mx-auto mb-4" />
            <h2 className="text-3xl font-bold mb-6">จองคิวสำเร็จ!</h2>
            <div className="bg-gray-50 rounded-2xl p-6 text-left max-w-sm mx-auto border mb-4">
              <p className="text-sm text-gray-500">Booking ID</p>
              <p className="font-mono font-bold text-lg text-blue-600 mb-4">{assignedDetails.id}</p>
              <p className="text-sm text-gray-500">เครื่องโปรเจคเตอร์</p>
              <p className="font-medium text-lg">เครื่องที่ {assignedDetails.machine}</p>
            </div>
            {assignedDetails.cancelCode && (
              <div className="bg-orange-50 border border-dashed border-orange-300 rounded-2xl p-5 max-w-sm mx-auto mb-8">
                <p className="text-xs text-orange-700 flex items-center justify-center gap-1"><Icons.Key className="h-4 w-4" /> รหัสยกเลิกการจอง (เก็บไว้เป็นความลับ)</p>
                <p className="font-mono font-bold text-3xl tracking-[0.3em] text-orange-600 mt-2">{assignedDetails.cancelCode}</p>
                <p className="text-xs text-orange-500 mt-2">ใช้รหัสนี้หากต้องการยกเลิกเองในหน้า "การจองของฉัน" (รหัสนี้ถูกส่งไปในอีเมลยืนยันด้วย)</p>
              </div>
            )}
            <button onClick={() => navigate('schedule')} className="w-full py-4 border-2 border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50">ดูตารางการใช้งาน</button>
          </div>
        )}
      </div>
    </div>
  );
}

function ScheduleView({ bookings, isLoading }) {
  const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
  const todays = bookings.filter(b => b.date === date && b.status !== 'CANCELLED');

  return (
    <div>
      <div className="flex flex-col sm:flex-row justify-between mb-8 gap-4">
        <h2 className="text-3xl font-bold flex items-center"><Icons.Calendar className="mr-3 text-blue-600 h-8 w-8" /> ตารางการใช้งาน</h2>
        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="p-2 border rounded-xl shadow-sm" />
      </div>
      <div className="bg-white rounded-3xl shadow-xl overflow-hidden border">
        {isLoading ? (
          <div className="p-20 text-center"><div className="loader mx-auto mb-4 border-blue-600"></div><p>กำลังโหลดข้อมูล...</p></div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-gray-50">
                  <th className="p-4 border-r sticky left-0 bg-gray-50">เวลา</th>
                  {MACHINES.map(m => <th key={m} className="p-4 text-center">เครื่อง {m}</th>)}
                </tr>
              </thead>
              <tbody>
                {SLOTS.map(slot => (
                  <tr key={slot} className="border-t">
                    <td className="p-4 sticky left-0 bg-white border-r font-medium">{slot}</td>
                    {MACHINES.map(m => {
                      const b = todays.find(x => x.slot === slot && Number(x.machine) === m);
                      return (
                        <td key={m} className="p-3 text-center border-l">
                          {b
                            ? <div className={`p-2 rounded-lg text-sm font-bold truncate max-w-[120px] mx-auto ${b.status === 'USED' ? 'bg-indigo-100 text-indigo-800' : 'bg-blue-100 text-blue-800'}`}>{b.groupName}{b.status === 'USED' && <div className="text-[10px] font-normal">เข้าใช้งานแล้ว</div>}</div>
                            : <div className="text-green-500 text-sm border border-green-200 border-dashed rounded p-2">ว่าง</div>}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function MyBookingView({ bookings, setBookings, showToast }) {
  const [searchId, setSearchId] = useState('');
  const [myBookings, setMyBookings] = useState(null);
  const [cancelTarget, setCancelTarget] = useState(null);
  const [cancelCodeInput, setCancelCodeInput] = useState('');
  const [isCancelling, setIsCancelling] = useState(false);

  const handleSearch = (e) => {
    e.preventDefault();
    setMyBookings(bookings.filter(b => b.studentId === searchId));
  };

  const openCancelModal = (booking) => {
    setCancelTarget(booking);
    setCancelCodeInput('');
  };

  const closeCancelModal = () => {
    setCancelTarget(null);
    setCancelCodeInput('');
  };

  const submitCancel = async (e) => {
    e.preventDefault();
    if (cancelCodeInput.trim().length !== 4) {
      showToast('กรุณากรอกรหัสยกเลิกให้ครบ 4 หลัก', 'error');
      return;
    }
    setIsCancelling(true);
    const res = await ServerAPI.invoke('cancelBookingByCode', cancelTarget.id, cancelCodeInput.trim());
    setIsCancelling(false);
    if (res.success) {
      const updater = list => list.map(b => b.id === cancelTarget.id ? { ...b, status: 'CANCELLED' } : b);
      setBookings(updater);
      setMyBookings(updater);
      showToast('ยกเลิกการจองสำเร็จ', 'success');
      closeCancelModal();
    } else {
      showToast(res.message, 'error');
    }
  };

  return (
    <div className="max-w-3xl mx-auto">
      <form onSubmit={handleSearch} className="flex gap-2 mb-8">
        <input type="text" placeholder="ค้นหาด้วยรหัสนิสิต" className="flex-1 p-4 rounded-xl border shadow-sm" value={searchId} onChange={e => setSearchId(e.target.value)} />
        <button type="submit" className="px-6 bg-blue-600 text-white rounded-xl shadow-md">ค้นหา</button>
      </form>
      {myBookings && (
        <div className="space-y-4">
          {myBookings.length === 0 ? <p className="text-center text-gray-500 bg-white p-8 rounded-xl">ไม่พบประวัติ</p> :
            myBookings.map(b => (
              <div key={b.id} onClick={() => b.status === 'ACTIVE' && openCancelModal(b)} className={`bg-white p-6 rounded-2xl shadow-sm border flex justify-between items-center ${b.status === 'ACTIVE' ? 'cursor-pointer hover:border-red-300 hover:shadow-md transition-all' : ''}`}>
                <div>
                  <p className="font-bold text-lg">{b.groupName} <span className={`text-xs px-2 py-1 rounded ml-2 ${b.status === 'ACTIVE' ? 'bg-green-100 text-green-700' : b.status === 'USED' ? 'bg-indigo-100 text-indigo-700' : 'bg-red-100 text-red-700'}`}>{b.status}</span></p>
                  <p className="text-gray-500 text-sm mt-1">วันที่: {b.date} | {b.slot}</p>
                  {b.status === 'ACTIVE' && <p className="text-xs text-red-500 mt-2 flex items-center gap-1"><Icons.Key className="h-3 w-3" /> แตะที่นี่เพื่อยกเลิกการจองด้วยรหัส 4 หลัก</p>}
                </div>
                <div className="text-right">
                  <p className="text-sm font-bold text-blue-600">เครื่องที่ {b.machine}</p>
                  <p className="text-xs text-gray-400 font-mono mt-1">{b.id}</p>
                </div>
              </div>
            ))
          }
        </div>
      )}

      {/* Cancel Modal */}
      {cancelTarget && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fade-in" onClick={closeCancelModal}>
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full" onClick={e => e.stopPropagation()}>
            <h3 className="text-xl font-bold mb-1 flex items-center gap-2"><Icons.Key className="h-5 w-5 text-orange-500" /> ยกเลิกการจอง</h3>
            <p className="text-sm text-gray-500 mb-4">{cancelTarget.groupName} — {cancelTarget.date} {cancelTarget.slot}</p>
            <form onSubmit={submitCancel} className="space-y-4">
              <input type="text" inputMode="numeric" maxLength={4} required autoFocus placeholder="XXXX" className="w-full p-4 rounded-xl border text-center text-3xl tracking-[0.4em] font-mono" value={cancelCodeInput} onChange={e => setCancelCodeInput(e.target.value.replace(/\D/g, '').slice(0, 4))} />
              <div className="flex gap-3">
                <button type="button" onClick={closeCancelModal} className="w-1/2 py-3 border rounded-xl">ปิด</button>
                <button type="submit" disabled={isCancelling} className="w-1/2 py-3 bg-red-600 text-white rounded-xl disabled:bg-gray-400 flex justify-center items-center">
                  {isCancelling ? <div className="loader border-t-white"></div> : 'ยืนยันยกเลิก'}
                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminView({ bookings, setBookings, showToast }) {
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [pass, setPass] = useState('');

  const login = (e) => {
    e.preventDefault();
    if (pass === '1205101') { setIsLoggedIn(true); showToast('Admin เข้าระบบสำเร็จ', 'success'); }
    else showToast('รหัสผ่านผิด', 'error');
  };

  const handleCancel = async (id) => {
    if (confirm('ยืนยันการยกเลิก ' + id + '?')) {
      const res = await ServerAPI.invoke('cancelBooking', id, '1205101');
      if (res.success) {
        setBookings(bookings.map(b => b.id === id ? {...b, status: 'CANCELLED'} : b));
        showToast('ยกเลิกเรียบร้อย', 'success');
      } else showToast(res.message, 'error');
    }
  };

  const handleMarkUsed = async (id) => {
    if (confirm('ยืนยันว่ากลุ่มนี้มารับ/เข้าใช้งานอุปกรณ์แล้ว?')) {
      const res = await ServerAPI.invoke('markAsUsed', id, '1205101');
      if (res.success) {
        setBookings(bookings.map(b => b.id === id ? {...b, status: 'USED'} : b));
        showToast('ยืนยันการเข้าใช้งานสำเร็จ', 'success');
      } else showToast(res.message, 'error');
    }
  };

  if (!isLoggedIn) return (
    <form onSubmit={login} className="max-w-sm mx-auto bg-white p-8 rounded-3xl shadow-xl mt-10">
      <Icons.ShieldAlert className="h-12 w-12 text-indigo-500 mx-auto mb-4" />
      <h2 className="text-center text-2xl font-bold mb-6">Admin Login</h2>
      <input type="password" required className="w-full p-3 border rounded-xl mb-4" placeholder="Admin Password" value={pass} onChange={e=>setPass(e.target.value)} />
      <button className="w-full p-3 bg-indigo-600 text-white rounded-xl">เข้าสู่ระบบ</button>
    </form>
  );

  return (
    <div>
      <div className="flex justify-between items-center mb-6">
        <h2 className="text-2xl font-bold">จัดการการจอง</h2>
        <button onClick={() => setIsLoggedIn(false)} className="text-red-500 text-sm flex items-center"><Icons.LogOut className="h-4 w-4 mr-1"/> ออกจากระบบ</button>
      </div>
      <div className="bg-white rounded-xl shadow border overflow-x-auto">
        <table className="w-full text-left text-sm">
          <thead className="bg-gray-50 border-b">
            <tr>
              <th className="p-4">ID</th>
              <th className="p-4">นิสิต</th>
              <th className="p-4">วันเวลา</th>
              <th className="p-4">เครื่อง</th>
              <th className="p-4">สถานะ</th>
              <th className="p-4">จัดการ</th>
            </tr>
          </thead>
          <tbody className="divide-y">
            {bookings.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(b => (
              <tr key={b.id} className="hover:bg-gray-50">
                <td className="p-4 font-mono text-gray-500">{b.id}</td>
                <td className="p-4"><b>{b.studentId}</b><br/>{b.studentName}</td>
                <td className="p-4">{b.date}<br/>{b.slot}</td>
                <td className="p-4 text-center font-bold text-blue-600">{b.machine}</td>
                <td className="p-4">
                  <span className={`px-2 py-1 rounded text-xs ${b.status==='ACTIVE' ? 'bg-green-100 text-green-700' : b.status==='USED' ? 'bg-indigo-100 text-indigo-700' : 'bg-red-100 text-red-700'}`}>{b.status}</span>
                </td>
                <td className="p-4 space-x-1 whitespace-nowrap">
                  {b.status === 'ACTIVE' && (
                    <>
                      <button onClick={() => handleMarkUsed(b.id)} className="text-indigo-600 hover:bg-indigo-50 px-2 py-1 rounded">เข้าใช้งานแล้ว</button>
                      <button onClick={() => handleCancel(b.id)} className="text-red-600 hover:bg-red-50 px-2 py-1 rounded">ยกเลิก</button>
                    </>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
